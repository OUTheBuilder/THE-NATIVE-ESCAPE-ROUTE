  // Session policy:
  //  - Staying signed in survives app switching / background (games keep going).
  //  - Premium Account locks when the app is backgrounded and returns to Home.
  //  - If the app was fully closed and is reopened more than 1 minute after it
  //    was last in the foreground, the session ends.
  var KH = "ouer_last_hidden", KL = "ouer_premium_lock", MAXAWAY = 60000, cold = false;

  try {

    sessionStorage.removeItem(KL);
  } catch (_) {}
  var onPremium = function () { return /^\/accounts(\/|$)/.test(location.pathname); };

      if (onPremium()) sessionStorage.setItem(KL, "1");
    } catch (_) {}
  };
  var show = function () {
    try {
      localStorage.removeItem(KH);
      if (sessionStorage.getItem(KL) === "1") {
        sessionStorage.removeItem(KL);
        location.replace("/");
      }
    } catch (_) {}
  };
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") hide(); else show();
  });
  window.addEventListener("pagehide", hide);
})();
