name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}

      - name: Set up Android SDK (components)
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: 33.0.2
          # Provide components as separate lines so they are passed correctly to sdkmanager
          components: |
            platform-tools
            cmdline-tools;latest
            build-tools;33.0.2
            platforms;android-33

      - name: Accept Android SDK licenses
        # Use the SDK root set by setup-android; accept all licenses before building
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Grant executable permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
